<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHAAN ENGINEERING</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #0b1a2a, #1c3d5a, #0b1a2a);
            background-size: 200% 200%;
            animation: gradientMove 15s ease infinite;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh; /* گونجاندنا سەد د سەد بۆ شاشەیێن ئایفۆنێ */
            width: 100%;
            overflow-x: hidden; /* ئەڤە رێگریێ ل لڤینا شاشەی بەرەڤ راستێ دکەت */
            padding: 20px; 
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            z-index: 0;
            animation: float 10s infinite ease-in-out alternate;
        }
        .blob-1 {
            width: 300px; height: 300px;
            background: #2563eb; 
            top: -10%; left: -10%;
        }
        .blob-2 {
            width: 400px; height: 400px;
            background: #0ea5e9;
            bottom: -10%; right: -10%;
            animation-delay: -5s;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px; 
            margin: 0 auto; /* دئێخیتە سەنتەرێ شاشەی ب دروستی */
            text-align: center;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
            z-index: 1;
            animation: slideUp 1s ease-out forwards;
        }

        .logo-img {
            width: 220px;
            max-width: 100%;
            margin-bottom: 20px;
            animation: pulseLogo 3s infinite ease-in-out; 
            filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.3));
        }

        .title {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 3px;
            margin-bottom: 5px;
            color: #ffffff;
        }

        .subtitle {
            font-size: 13px;
            color: #a3b8cc;
            margin-bottom: 35px;
            line-height: 1.8;
            font-weight: 400; 
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
            padding: 16px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            color: #ffffff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500; 
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(5px);
            -webkit-tap-highlight-color: transparent; 
        }

        .btn:hover, .btn:active {
            transform: translateY(-5px); 
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .btn i {
            font-size: 24px;
        }

        .whatsapp:hover, .whatsapp:active { color: #25D366; border-color: #25D366; }
        .instagram:hover, .instagram:active { color: #E1306C; border-color: #E1306C; }
        .tiktok:hover, .tiktok:active { color: #ffffff; text-shadow: 2px 2px 0px #ff0050, -2px -2px 0px #00f2fe; border-color: #ffffff; }

        .location {
            margin-top: 25px;
            font-size: 14px;
            color: #8da4b8;
            font-weight: 400; 
        }

        @media (max-width: 380px) {
            .glass-card {
                padding: 30px 20px;
                border-radius: 20px;
            }
            .logo-img { width: 180px; }
            .title { font-size: 16px; letter-spacing: 2px; }
            .subtitle { font-size: 12px; margin-bottom: 25px; }
            .btn { padding: 14px; font-size: 14px; gap: 10px; }
            .btn i { font-size: 20px; }
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-30px) scale(1.1); }
        }
        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulseLogo {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); filter: drop-shadow(0px 0px 15px rgba(255,255,255,0.2)); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="glass-card">
        
        <img src="logo.png" alt="SHAAN ENGINEERING" class="logo-img">
        
        <div class="title">SHAAN ENGINEERING</div>
        
        <div class="subtitle">
            Architecture • Engineering • Construction<br>
            Design | Consultancy | Supervision | Execution<br>
            <strong style="color: #fff; margin-top: 5px; display: inline-block; font-weight: 600; letter-spacing: 1px;">FROM VISION TO REALITY</strong>
        </div>

        <a href="https://wa.me/96407512220006" class="btn whatsapp" target="_blank">
            <i class="fa-brands fa-whatsapp"></i> WhatsApp
        </a>

        <a href="https://instagram.com/shaan.engineering" class="btn instagram" target="_blank">
            <i class="fa-brands fa-instagram"></i> Instagram
        </a>

        <a href="https://tiktok.com/@shaan.engineering" class="btn tiktok" target="_blank">
            <i class="fa-brands fa-tiktok"></i> TikTok
        </a>

        <div class="location">
            <i class="fa-solid fa-location-dot"></i> Zakho, Kurdistan
        </div>

    </div>

</body>
</html>
